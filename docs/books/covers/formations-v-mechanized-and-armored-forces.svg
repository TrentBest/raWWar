  </g>
  <g transform="translate(205 350)">
    <path d="M0 55L25 15H180L220 55V100H0Z" fill="url(#armor)" stroke="#d9e5dc" stroke-width="3"/>
    <path d="M75 15L100 -10H160L180 15Z" fill="#748b7d" stroke="#d9e5dc" stroke-width="3"/>
    <path d="M30 100H195" stroke="#d9e5dc" stroke-width="8" stroke-linecap="round"/>
    <g fill="#263746" stroke="#c8d5ca" stroke-width="3"><circle cx="35" cy="100" r="15"/><circle cx="85" cy="100" r="15"/><circle cx="135" cy="100" r="15"/><circle cx="185" cy="100" r="15"/></g>
  </g>
  <g transform="translate(670 330)">
    <path d="M0 65L35 20H215L255 65V115H0Z" fill="url(#armor)" stroke="#d9e5dc" stroke-width="3"/>
    <path d="M90 20L120 -5H185L215 20Z" fill="#748b7d" stroke="#d9e5dc" stroke-width="3"/>
    <path d="M30 115H225" stroke="#d9e5dc" stroke-width="8" stroke-linecap="round"/>
    <g fill="#263746" stroke="#c8d5ca" stroke-width="3"><circle cx="40" cy="115" r="16"/><circle cx="100" cy="115" r="16"/><circle cx="160" cy="115" r="16"/><circle cx="220" cy="115" r="16"/></g>
  </g>
  <g fill="#d9e5dc" font-family="sans-serif" text-anchor="middle">
    <text x="600" y="80" font-size="18" letter-spacing="5">THE SINGULARITY WORKSHOP</text>
    <text x="600" y="610" font-size="34" font-weight="700">FORMATIONS V</text>
    <text x="600" y="650" font-size="18" letter-spacing="2">MECHANIZED &amp; ARMORED FORCES</text>
