<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Formations V: Mechanized and Armored Forces</title>
  <desc id="desc">An original abstract illustration of a mechanized formation, represented by layered vehicle silhouettes, crew markers, and linked support lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#263746"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aaa91"/>
      <stop offset="1" stop-color="#536b61"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="#b8c8bd" stroke-opacity=".28" stroke-width="2">
    <path d="M80 450H1120M140 390L340 270L560 390L790 250L1060 390"/>
    <path d="M340 270L340 130M790 250L790 110M560 390L560 545"/>
    <circle cx="340" cy="270" r="105"/><circle cx="790" cy="250" r="135"/>
  </g>
  <g fill="#d9e5dc" opacity=".85">
