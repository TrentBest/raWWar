<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="24" fill="#172332"/><text x="48" y="58" fill="#e5c58c" font-family="Arial" font-size="16">raWWar · ENGINEERING CONCEPT</text><text x="48" y="104" fill="#f5f7f9" font-family="Arial" font-size="32" font-weight="bold">A ship is a hierarchy. A wreck is still a world.</text><text x="48" y="138" fill="#bdcbd7" font-family="Arial" font-size="17">Illustrative subsystem slice · candidate model, not a completed specification</text><g transform="translate(60 190)"><path d="M20 90 L100 45 L420 45 L510 90 L420 135 L100 135 Z" fill="#526b80" stroke="#c3d2df" stroke-width="2"/><path d="M100 45 V135 M240 45 V135 M340 45 V135 M420 45 V135" stroke="#e5c58c" stroke-width="2" stroke-dasharray="5 5"/><rect x="120" y="60" width="100" height="60" rx="5" fill="#386b7c"/><rect x="260" y="60" width="60" height="60" rx="5" fill="#967447"/><rect x="355" y="60" width="50" height="60" rx="5" fill="#80566b"/><text x="170" y="87" text-anchor="middle" fill="white" font-family="Arial" font-size="13">Crew / life</text><text x="170" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="13">support</text><text x="290" y="94" text-anchor="middle" fill="white" font-family="Arial" font-size="13">Power</text><text x="380" y="94" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Thrust</text><text x="270" y="175" text-anchor="middle" fill="#bdcbd7" font-family="Arial" font-size="14">Forward +X ← local frame → Aft −X</text></g><g font-family="Arial"><rect x="48" y="400" width="340" height="170" rx="14" fill="#202f40" stroke="#90a8ba"/><text x="70" y="435" fill="#e5c58c" font-size="18" font-weight="bold">01 · Resolve the impact</text><text x="70" y="470" fill="#eaf0f4" font-size="15">Location, angle, layers, occlusion,</text><text x="70" y="495" fill="#eaf0f4" font-size="15">part condition and connections.</text><text x="70" y="540" fill="#91c8d4" font-size="13">Precompute candidates, not fate.</text><path d="M392 485 H424" stroke="#e5c58c" stroke-width="3"/><path d="M415 477 L425 485 L415 493" fill="none" stroke="#e5c58c" stroke-width="3"/><rect x="430" y="400" width="340" height="170" rx="14" fill="#202f40" stroke="#b48b65"/><text x="452" y="435" fill="#e5c58c" font-size="18" font-weight="bold">02 · Causal cascade</text><text x="452" y="470" fill="#eaf0f4" font-size="15">Dependent systems, real triggers,</text><text x="452" y="495" fill="#eaf0f4" font-size="15">barriers, containment and response.</text><text x="452" y="540" fill="#e3b48a" font-size="13">Critical does not mean magic.</text><path d="M774 485 H806" stroke="#e5c58c" stroke-width="3"/><path d="M797 477 L807 485 L797 493" fill="none" stroke="#e5c58c" stroke-width="3"/><rect x="812" y="400" width="340" height="170" rx="14" fill="#202f40" stroke="#7bb7a4"/><text x="834" y="435" fill="#e5c58c" font-size="18" font-weight="bold">03 · Persistent wreck</text><text x="834" y="470" fill="#eaf0f4" font-size="15">Surviving parts, repair work,</text><text x="834" y="495" fill="#eaf0f4" font-size="15">salvage, hazards and evidence.</text><text x="834" y="540" fill="#9ad6bd" font-size="13">The world remembers the event.</text></g><text x="48" y="620" fill="#e5c58c" font-family="Arial" font-size="20" font-weight="bold">Damage creates work. Consequences become history.</text></svg>