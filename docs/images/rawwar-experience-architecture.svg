<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">raWWar Experience architecture</title><desc id="d">raWWar owns its world and meaning while Workshop technology provides reusable infrastructure through FSM API, MicroBundles, FSM COS, AnyApp and Renderer.</desc>
<rect width="1600" height="900" fill="#0b1016"/>
<text x="800" y="80" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">BUILD THE WAR. DON'T REBUILD THE MACHINE.</text>
<text x="800" y="118" text-anchor="middle" fill="#aebbc5" font-family="sans-serif" font-size="21">raWWar defines meaning. Workshop supplies the machinery that makes meaning behave.</text>
<g font-family="sans-serif">
