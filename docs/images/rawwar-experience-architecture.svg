<text x="800" y="820" text-anchor="middle" fill="#d6b76b" font-family="sans-serif" font-size="25" letter-spacing="3">EVERY BOX WE DON'T HAVE TO REINVENT IS TIME WE CAN SPEND MAKING THE WORLD MATTER.</text>
