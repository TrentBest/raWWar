<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">raWWar Milky Way reference layers</title>
<desc id="desc">Scientific observations, inferred galactic structure, deterministic generated populations, and player-facing navigation remain separate layers. Earth and the Solar System are highlighted in the Local Orion Arm.</desc>
<defs>
  <radialGradient id="core"><stop offset="0" stop-color="#fff4cc"/><stop offset=".2" stop-color="#f3b36b"/><stop offset="1" stop-color="#f3b36b" stop-opacity="0"/></radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14243b"/><stop offset="1" stop-color="#08111f"/></linearGradient>
  <style>
    .bg{fill:#07101d}.title{font:700 28px sans-serif;fill:#f4f7fb}.sub{font:15px sans-serif;fill:#b9c7d9}.label{font:700 16px sans-serif;fill:#edf4ff}.small{font:13px sans-serif;fill:#c1cede}.tiny{font:11px sans-serif;fill:#9eb0c8}.rule{stroke:#526982;stroke-width:1}.observed{fill:#85d7f5}.inferred{fill:#d4a7ff}.generated{fill:#8be0b0}.ui{fill:#ffcf70}
  </style>
</defs>
<rect class="bg" width="1200" height="720"/>
<text x="44" y="48" class="title">THE MILKY WAY · A REFERENCE MODEL, NOT A PAINTING</text>
<text x="44" y="76" class="sub">Measured astronomy → inferred structure → procedural expansion → observer-relative presentation</text>
<rect x="36" y="102" width="720" height="570" rx="18" fill="url(#panel)" stroke="#344861"/>
<g transform="translate(390 385)">
  <ellipse rx="310" ry="205" fill="none" stroke="#2a4562" stroke-width="1.5"/>
  <ellipse rx="260" ry="165" fill="none" stroke="#2a4562" stroke-width="1"/>
  <ellipse rx="195" ry="125" fill="none" stroke="#2a4562" stroke-width="1"/>
  <ellipse rx="118" ry="76" fill="none" stroke="#2a4562" stroke-width="1"/>
  <ellipse rx="88" ry="46" fill="#edb86a" opacity=".16" transform="rotate(-18)"/>
  <ellipse rx="62" ry="28" fill="#f4c98a" opacity=".2" transform="rotate(-18)"/>
  <circle r="82" fill="url(#core)"/>
  <path d="M-12,-2 C-72,-88 -194,-152 -267,-76 C-320,-20 -245,66 -173,53 C-101,39 -66,-7 -25,-9" fill="none" stroke="#d4a7ff" stroke-width="19" opacity=".22" stroke-linecap="round"/>
  <path d="M-12,-2 C-72,-88 -194,-152 -267,-76 C-320,-20 -245,66 -173,53 C-101,39 -66,-7 -25,-9" fill="none" stroke="#d4a7ff" stroke-width="2.5" opacity=".9"/>
  <path d="M16,10 C95,72 231,102 277,24 C312,-35 249,-93 178,-80 C117,-67 85,-20 36,-9" fill="none" stroke="#d4a7ff" stroke-width="16" opacity=".17" stroke-linecap="round"/>
  <path d="M16,10 C95,72 231,102 277,24 C312,-35 249,-93 178,-80 C117,-67 85,-20 36,-9" fill="none" stroke="#d4a7ff" stroke-width="2.5" opacity=".9"/>
  <path d="M-8,15 C-52,108 -15,168 68,160 C146,152 174,86 139,45" fill="none" stroke="#d4a7ff" stroke-width="14" opacity=".16" stroke-linecap="round"/>
  <path d="M-8,15 C-52,108 -15,168 68,160 C146,152 174,86 139,45" fill="none" stroke="#d4a7ff" stroke-width="2.5" opacity=".9"/>
  <path d="M8,-13 C-11,-62 2,-108 55,-130 C102,-149 144,-120 154,-88" fill="none" stroke="#d4a7ff" stroke-width="12" opacity=".15" stroke-linecap="round"/>
  <path d="M8,-13 C-11,-62 2,-108 55,-130 C102,-149 144,-120 154,-88" fill="none" stroke="#d4a7ff" stroke-width="2.5" opacity=".9"/>
  <g fill="#85d7f5">
    <circle cx="-260" cy="-74" r="2.5"/><circle cx="-231" cy="-105" r="2"/><circle cx="-212" cy="12" r="2"/><circle cx="-178" cy="49" r="2.5"/><circle cx="-150" cy="-102" r="2"/><circle cx="-100" cy="-136" r="2"/><circle cx="-76" cy="78" r="2"/><circle cx="-38" cy="-92" r="2"/><circle cx="53" cy="-144" r="2"/><circle cx="97" cy="-98" r="2"/><circle cx="148" cy="-75" r="2"/><circle cx="205" cy="-49" r="2.5"/><circle cx="268" cy="25" r="2"/><circle cx="229" cy="66" r="2"/><circle cx="169" cy="111" r="2"/><circle cx="84" cy="151" r="2.5"/><circle cx="-10" cy="128" r="2"/><circle cx="-124" cy="91" r="2"/><circle cx="-274" cy="-30" r="2"/>
  </g>
  <circle cx="205" cy="-49" r="8" fill="#ffcf70" stroke="#fff0c6" stroke-width="2"/>
  <circle cx="205" cy="-49" r="17" fill="none" stroke="#ffcf70" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M212,-58 L248,-96 L315,-96" fill="none" stroke="#ffcf70" stroke-width="1.5"/>
  <text x="248" y="-109" class="label">SOL / EARTH</text>
  <text x="248" y="-91" class="tiny">Local (Orion) Arm · schematic</text>
  <text x="-40" y="7" class="small" text-anchor="middle">Galactic Centre</text>
</g>
<text x="62" y="133" class="tiny">SCHEMATIC STRUCTURE · NOT A STAR-BY-STAR PLOT</text>
<text x="62" y="645" class="tiny">Arm geometry is inferred and model-dependent. Marker position is illustrative.</text>
<rect x="780" y="102" width="384" height="570" rx="18" fill="url(#panel)" stroke="#344861"/>
<text x="808" y="139" class="label">Four separate layers</text>
<circle cx="816" cy="177" r="5" class="observed"/><text x="832" y="182" class="label">Observed catalogue</text>
<text x="832" y="202" class="small">Measured positions, motion, source, epoch</text>
<circle cx="816" cy="239" r="5" class="inferred"/><text x="832" y="244" class="label">Inferred structure</text>
<text x="832" y="264" class="small">Bars, arms, density models, uncertainty</text>
<circle cx="816" cy="301" r="5" class="generated"/><text x="832" y="306" class="label">Generated population</text>
<text x="832" y="326" class="small">Seeded systems, never mislabeled as measured</text>
<circle cx="816" cy="363" r="5" class="ui"/><text x="832" y="368" class="label">Player presentation</text>
<text x="832" y="388" class="small">Zoom, labels, route overlays, horizon HUD</text>
<line x1="808" y1="415" x2="1136" y2="415" class="rule"/>
<text x="808" y="444" class="label">Scale must remain honest</text>
<text x="808" y="469" class="small">• Solar galactic orbit: ~230 million years</text>
<text x="808" y="493" class="small">• 10,000 years: ~0.016° simple orbit</text>
<text x="808" y="517" class="small">• Map symbols may enlarge; coordinates may not</text>
<text x="808" y="541" class="small">• A marker does not mean naked-eye visibility</text>
<line x1="808" y1="563" x2="1136" y2="563" class="rule"/>
<text x="808" y="590" class="label">Earth-to-galaxy drill-down</text>
<text x="808" y="615" class="small">Milky Way → Local Arm → Solar neighbourhood</text>
<text x="808" y="637" class="small">→ Solar System → Earth</text>
<text x="44" y="700" class="tiny">raWWar · Candidate scientific baseline · visual structure is explanatory, not authoritative data</text>
</svg>