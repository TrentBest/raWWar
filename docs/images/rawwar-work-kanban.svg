<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">raWWar work board: real work, real consequences</title><desc id="desc">Seven kanban columns represent work lifecycle states. A card moves only when real-world authorization, prerequisites, people, resources, safety, evidence, and acceptance conditions are satisfied.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#15232d"/></linearGradient><linearGradient id="gold" x2="1" y2="0"><stop stop-color="#b98b45"/><stop offset="1" stop-color="#f0d89a"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="64" y="70" fill="#f2f5f6" font-family="Arial,sans-serif" font-size="42" font-weight="700">THE BOARD SHOWS THE WORK. IT DOESN'T DO THE WORK.</text>
<text x="66" y="110" fill="#a9bdc7" font-family="Arial,sans-serif" font-size="22">A living kanban is a view over persistent work orders, agents, dependencies, resources, and world events.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(54 165)">
<g><rect width="205" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="205" height="62" rx="16" fill="#293a45"/><text x="102" y="39" text-anchor="middle" fill="#f0f4f5" font-size="20" font-weight="700">PROPOSED</text><text x="20" y="104" fill="#dbe5e9" font-size="18">Science floor</text><text x="20" y="132" fill="#93aab5" font-size="15">Need identified</text><text x="20" y="178" fill="#93aab5" font-size="15">No authorization</text><text x="20" y="204" fill="#93aab5" font-size="15">or committed crew</text><path d="M20 235H185" stroke="#354b57"/><text x="20" y="273" fill="#d4b978" font-size="15">Evidence:</text><text x="20" y="299" fill="#b5c5cc" font-size="15">research need</text><text x="20" y="325" fill="#b5c5cc" font-size="15">and scope draft</text></g>
<g transform="translate(220)"><rect width="205" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="205" height="62" rx="16" fill="#284b59"/><text x="102" y="39" text-anchor="middle" fill="#f0f4f5" font-size="20" font-weight="700">READY</text><text x="20" y="104" fill="#dbe5e9" font-size="18">Site cleared</text><text x="20" y="132" fill="#93aab5" font-size="15">Scope authorized</text><text x="20" y="178" fill="#93aab5" font-size="15">Qualified team</text><text x="20" y="204" fill="#93aab5" font-size="15">and resources</text><path d="M20 235H185" stroke="#354b57"/><text x="20" y="273" fill="#d4b978" font-size="15">Gate:</text><text x="20" y="299" fill="#b5c5cc" font-size="15">dependencies</text><text x="20" y="325" fill="#b5c5cc" font-size="15">checked again</text></g>
<g transform="translate(440)"><rect width="205" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="205" height="62" rx="16" fill="#365849"/><text x="102" y="39" text-anchor="middle" fill="#f0f4f5" font-size="20" font-weight="700">IN PROGRESS</text><text x="20" y="104" fill="#dbe5e9" font-size="18">Excavation</text><text x="20" y="132" fill="#93aab5" font-size="15">Agents perform</text><text x="20" y="178" fill="#93aab5" font-size="15">Actual materials</text><text x="20" y="204" fill="#93aab5" font-size="15">and time consumed</text><path d="M20 235H185" stroke="#354b57"/><text x="20" y="273" fill="#d4b978" font-size="15">Evidence:</text><text x="20" y="299" fill="#b5c5cc" font-size="15">survey readings</text><text x="20" y="325" fill="#b5c5cc" font-size="15">and work log</text></g>
<g transform="translate(660)"><rect width="205" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="205" height="62" rx="16" fill="#624c32"/><text x="102" y="39" text-anchor="middle" fill="#f0f4f5" font-size="20" font-weight="700">BLOCKED</text><text x="20" y="104" fill="#dbe5e9" font-size="18">Support alloy</text><text x="20" y="132" fill="#93aab5" font-size="15">not delivered</text><text x="20" y="178" fill="#93aab5" font-size="15">Work pauses or</text><text x="20" y="204" fill="#93aab5" font-size="15">changes safely</text><path d="M20 235H185" stroke="#354b57"/><text x="20" y="273" fill="#e5b875" font-size="15">Blocker:</text><text x="20" y="299" fill="#b5c5cc" font-size="15">real stock / route</text><text x="20" y="325" fill="#b5c5cc" font-size="15">dependency</text></g>
<g transform="translate(880)"><rect width="205" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="205" height="62" rx="16" fill="#4d4568"/><text x="102" y="39" text-anchor="middle" fill="#f0f4f5" font-size="20" font-weight="700">VERIFICATION</text><text x="20" y="104" fill="#dbe5e9" font-size="18">Structure built</text><text x="20" y="132" fill="#93aab5" font-size="15">Awaiting inspection</text><text x="20" y="178" fill="#93aab5" font-size="15">Tests and hold</text><text x="20" y="204" fill="#93aab5" font-size="15">points still matter</text><path d="M20 235H185" stroke="#354b57"/><text x="20" y="273" fill="#d4b978" font-size="15">Evidence:</text><text x="20" y="299" fill="#b5c5cc" font-size="15">measured tests</text><text x="20" y="325" fill="#b5c5cc" font-size="15">and signed review</text></g>
<g transform="translate(1100)"><rect width="205" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="205" height="62" rx="16" fill="#315f52"/><text x="102" y="39" text-anchor="middle" fill="#f0f4f5" font-size="20" font-weight="700">ACCEPTED</text><text x="20" y="104" fill="#dbe5e9" font-size="18">Commissioned</text><text x="20" y="132" fill="#93aab5" font-size="15">World state updated</text><text x="20" y="178" fill="#93aab5" font-size="15">Staffing, utilities</text><text x="20" y="204" fill="#93aab5" font-size="15">and operation valid</text><path d="M20 235H185" stroke="#354b57"/><text x="20" y="273" fill="#d4b978" font-size="15">Record:</text><text x="20" y="299" fill="#b5c5cc" font-size="15">acceptance and</text><text x="20" y="325" fill="#b5c5cc" font-size="15">capability history</text></g>
<g transform="translate(1320)"><rect width="150" height="475" rx="16" fill="#14222b" stroke="#627580" stroke-width="2"/><rect width="150" height="62" rx="16" fill="#49343b"/><text x="75" y="39" text-anchor="middle" fill="#f0f4f5" font-size="18" font-weight="700">CANCELLED</text><text x="16" y="104" fill="#dbe5e9" font-size="18">Stopped</text><text x="16" y="132" fill="#93aab5" font-size="15">by authority</text><text x="16" y="178" fill="#93aab5" font-size="15">Work and costs</text><text x="16" y="204" fill="#93aab5" font-size="15">remain in history</text><path d="M16 235H134" stroke="#354b57"/><text x="16" y="273" fill="#d4b978" font-size="15">Record:</text><text x="16" y="299" fill="#b5c5cc" font-size="15">who, why,</text><text x="16" y="325" fill="#b5c5cc" font-size="15">what remains</text></g>
<g stroke="url(#gold)" stroke-width="4" fill="none"><path d="M205 525H218"/><path d="M425 525H438"/><path d="M645 525H658"/><path d="M865 525H878"/><path d="M1085 525H1098"/><path d="M1305 525H1318"/></g>
</g>
<rect x="55" y="690" width="1490" height="135" rx="20" fill="#101a22" stroke="#596d77" stroke-width="2"/>
<text x="85" y="735" fill="#e9d29a" font-size="22" font-weight="700">THE BOARD IS NOT THE SIMULATION</text>
<text x="85" y="774" fill="#c2d0d6" font-size="19">Reordering a card cannot create labor, material, power, qualifications, safe conditions, or a passing inspection.</text>
<text x="85" y="805" fill="#9db2bc" font-size="18">Every transition must be justified by world state and recorded evidence. Priority changes only what gets attention next.</text>
</g></svg>