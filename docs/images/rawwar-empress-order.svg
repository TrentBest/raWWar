<text x="70" y="75" font-size="38" font-weight="700">THE EMPRESS DOESN'T ASK.</text><text x="70" y="110" font-size="20" opacity=".7">She issues the order. The player chooses what the order means.</text>
<g transform="translate(70 175)"><rect width="260" height="150" rx="16" fill="#fff" opacity=".08" stroke="#8794ad"/><text x="25" y="48" font-size="18">1 · CHOOSE FACTION</text><text x="25" y="82" font-size="27" font-weight="700">PLAYER</text><text x="25" y="116" font-size="16" opacity=".7">enters the political game</text></g>
<g transform="translate(405 175)"><rect width="320" height="150" rx="16" fill="#fff" opacity=".12" stroke="#c7cedc"/><text x="25" y="48" font-size="18">2 · THE EMPRESS</text><text x="25" y="82" font-size="27" font-weight="700">ISSUES THE ORDER</text><text x="25" y="116" font-size="16" opacity=".7">take the resource-rich enemy world</text></g>
<g transform="translate(800 145)"><rect width="250" height="95" rx="16" fill="#fff" opacity=".08" stroke="#8794ad"/><text x="25" y="42" font-size="20" font-weight="700">OBEY</text><text x="25" y="70" font-size="15" opacity=".75">reward → greater demands</text></g>
<g transform="translate(800 275)"><rect width="250" height="95" rx="16" fill="#fff" opacity=".08" stroke="#8794ad"/><text x="25" y="42" font-size="20" font-weight="700">DISOBEY</text><text x="25" y="70" font-size="15" opacity=".75">political + military consequences</text></g>
