<text x="60" y="665" fill="#b8cbd2" font-family="Arial" font-size="18">DETAIL = GEOMETRY + IDENTITY + BEHAVIOR + RELATIONSHIPS + STATE + CAPABILITY + HISTORY + CONTEXT</text>
