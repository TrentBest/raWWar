<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="t d">
<title id="t">raWWar living world model</title><desc id="d">A military installation shown as a living system: launch pad, training, research, construction, logistics and command activity continue simultaneously.</desc>
<defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="#0b1119"/><stop offset="1" stop-color="#202b35"/></linearGradient><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#71808b" stroke-opacity=".12"/></pattern></defs>
<rect width="1600" height="850" fill="url(#b)"/><rect width="1600" height="850" fill="url(#g)"/>
<text x="80" y="90" fill="#fff" font-family="sans-serif" font-size="54" font-weight="700">THE WORLD IS ALWAYS DOING SOMETHING.</text>
<text x="80" y="130" fill="#aebbc5" font-family="sans-serif" font-size="22">One observation. Many independent procedures. One living military system.</text>
<g font-family="sans-serif">
 <g transform="translate(80 190)"><rect width="420" height="250" rx="22" fill="#17212b" stroke="#71808b"/><text x="28" y="48" fill="#fff" font-size="28" font-weight="700">LAUNCH PAD</text><text x="28" y="82" fill="#aebbc5" font-size="18">crew checks · fueling · clearance</text><path d="M55 190 L160 100 L270 190Z" fill="#3b4853"/><path d="M150 170 L205 105 L230 190" fill="none" stroke="#d6b76b" stroke-width="10"/></g>
 <g transform="translate(590 190)"><rect width="420" height="250" rx="22" fill="#17212b" stroke="#71808b"/><text x="28" y="48" fill="#fff" font-size="28" font-weight="700">TRAINING</text><text x="28" y="82" fill="#aebbc5" font-size="18">qualification · drills · recovery</text><circle cx="115" cy="158" r="45" fill="#34414b" stroke="#d6b76b" stroke-width="7"/><circle cx="260" cy="158" r="45" fill="#34414b" stroke="#8da6b8" stroke-width="7"/><path d="M115 158 L260 158" stroke="#71808b" stroke-width="8"/></g>
 <g transform="translate(1100 190)"><rect width="420" height="250" rx="22" fill="#17212b" stroke="#71808b"/><text x="28" y="48" fill="#fff" font-size="28" font-weight="700">RESEARCH</text><text x="28" y="82" fill="#aebbc5" font-size="18">experiments · requests · discoveries</text><circle cx="210" cy="155" r="70" fill="#34414b" stroke="#8da6b8" stroke-width="7"/><path d="M165 190 L210 110 L255 190 M180 170 H240" fill="none" stroke="#d6b76b" stroke-width="7"/></g>
 <g transform="translate(80 500)"><rect width="420" height="250" rx="22" fill="#17212b" stroke="#71808b"/><text x="28" y="48" fill="#fff" font-size="28" font-weight="700">LOGISTICS</text><text x="28" y="82" fill="#aebbc5" font-size="18">materials · repairs · movement</text><rect x="65" y="130" width="125" height="70" fill="#394752"/><rect x="220" y="145" width="125" height="55" fill="#394752"/><path d="M50 220H370" stroke="#d6b76b" stroke-width="7"/></g>
 <g transform="translate(590 500)"><rect width="420" height="250" rx="22" fill="#17212b" stroke="#71808b"/><text x="28" y="48" fill="#fff" font-size="28" font-weight="700">COMMAND</text><text x="28" y="82" fill="#aebbc5" font-size="18">orders · staff · morale · decisions</text><circle cx="210" cy="158" r="62" fill="#394752" stroke="#d6b76b" stroke-width="8"/><path d="M210 115V200 M167 158H253" stroke="#e5e9eb" stroke-width="7"/></g>
 <g transform="translate(1100 500)"><rect width="420" height="250" rx="22" fill="#17212b" stroke="#71808b"/><text x="28" y="48" fill="#fff" font-size="28" font-weight="700">SOCIAL LIFE</text><text x="28" y="82" fill="#aebbc5" font-size="18">downtime · relationships · recreation</text><circle cx="145" cy="155" r="38" fill="#394752"/><circle cx="270" cy="155" r="38" fill="#394752"/><path d="M183 155H232" stroke="#d6b76b" stroke-width="7"/></g>
</g>
<text x="800" y="810" text-anchor="middle" fill="#d6b76b" font-family="sans-serif" font-size="24" letter-spacing="4">CAPACITY IS NOT READINESS · DATA IS DETAIL · PROCEDURES ARE ALIVE</text>
</svg>