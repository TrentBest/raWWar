<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">raWWar underground science floor construction and commissioning</title>
<desc id="desc">An engineering section diagram showing a headquarters above ground and a staged underground science floor. Excavation, ground support, structure, separated utilities, power and containment, laboratories, staffing, tests, and acceptance are sequential prerequisites; the facility is not operational just because its shell exists.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101e29"/><stop offset="1" stop-color="#1c303a"/></linearGradient><linearGradient id="soil" x2="0" y2="1"><stop stop-color="#4b463a"/><stop offset="1" stop-color="#262b2a"/></linearGradient></defs>
<rect width="1500" height="920" fill="#071018"/>
<rect x="0" y="120" width="1500" height="250" fill="url(#sky)"/>
<rect x="0" y="370" width="1500" height="550" fill="url(#soil)"/>
<text x="55" y="62" fill="#f1f5f6" font-family="Arial,sans-serif" font-size="39" font-weight="700">A SCIENCE FLOOR IS CONSTRUCTED — NOT UNLOCKED</text>
<text x="57" y="100" fill="#a9bdc7" font-family="Arial,sans-serif" font-size="20">Illustrative section: the science advisor can start a project, but only completed and accepted work creates an operational facility.</text>
<path d="M0 370H1500" stroke="#d1b579" stroke-width="5"/>
<g font-family="Arial,sans-serif">
<rect x="150" y="190" width="410" height="175" rx="12" fill="#1b2b35" stroke="#81949c" stroke-width="3"/>
<path d="M125 190L355 115L585 190Z" fill="#314752" stroke="#81949c" stroke-width="3"/>
<text x="355" y="235" text-anchor="middle" fill="#edf3f5" font-size="27" font-weight="700">HEADQUARTERS</text>
<text x="355" y="270" text-anchor="middle" fill="#b7c8ce" font-size="18">command · advisors · security</text>
<text x="355" y="302" text-anchor="middle" fill="#b7c8ce" font-size="18">orders, oversight, budget</text>
<path d="M355 365V420" stroke="#d1b579" stroke-width="6" stroke-dasharray="9 8"/>
<text x="380" y="404" fill="#f0d79b" font-size="16">access shaft / service route</text>
<rect x="85" y="445" width="1330" height="380" rx="16" fill="#252d2c" stroke="#a58b61" stroke-width="3"/>
<rect x="110" y="470" width="1280" height="70" rx="10" fill="#3a4039" stroke="#b2a17c" stroke-width="2"/>
<text x="135" y="512" fill="#f0d8a1" font-size="21" font-weight="700">1 · SITE INVESTIGATION + EXCAVATION</text>
<text x="650" y="512" fill="#d0d6cf" font-size="17">survey · groundwater · spoil removal · temporary works</text>
<rect x="110" y="555" width="1280" height="65" rx="10" fill="#34413f" stroke="#9ab0b4" stroke-width="2"/>
<text x="135" y="595" fill="#dbe9ec" font-size="21" font-weight="700">2 · GROUND SUPPORT + STRUCTURE</text>
<text x="650" y="595" fill="#b8c9cd" font-size="17">retention · foundation · shell · water and load paths</text>
<rect x="110" y="635" width="1280" height="65" rx="10" fill="#273d4a" stroke="#83aab9" stroke-width="2"/>
<text x="135" y="675" fill="#d9edf4" font-size="21" font-weight="700">3 · UTILITIES + PROTECTION</text>
<text x="650" y="675" fill="#b5d0da" font-size="17">power isolation · cooling · ventilation · data · fire and containment</text>
<rect x="110" y="715" width="1280" height="65" rx="10" fill="#263e36" stroke="#83b49b" stroke-width="2"/>
<text x="135" y="755" fill="#d9f0e4" font-size="21" font-weight="700">4 · LABS + COMMISSIONING</text>
<text x="650" y="755" fill="#b5d5c6" font-size="17">instrumentation · calibration · qualified staff · safety tests · acceptance</text>
<g stroke="#d1b579" stroke-width="4" fill="none"><path d="M720 540V555"/><path d="M720 620V635"/><path d="M720 700V715"/></g>
<rect x="100" y="845" width="1300" height="48" rx="10" fill="#151e24" stroke="#596f79"/>
<text x="750" y="876" text-anchor="middle" fill="#e6d09a" font-size="20" font-weight="700">SHELL COMPLETE ≠ LAB READY · RESEARCH ELIGIBILITY ≠ OPERATIONAL CAPABILITY</text>
</g></svg>