name: Publish raWWar living concept to GitHub Pages

on:
  push:
    branches: [development, integration/autonomous-development-pipeline]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble the visitor site from versioned sources
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          mkdir -p site/docs site/samples/SoldierField
          cp -R docs/images site/docs/images
          cp -R samples/SoldierField/WebGpuRunner site/samples/SoldierField/WebGpuRunner
          test -s site/docs/images/rawwar-hero.svg
          test -s site/docs/images/soldier-field/06-field-formation.svg
          test -s site/samples/SoldierField/WebGpuRunner/index.html
          test -s site/samples/SoldierField/WebGpuRunner/soldier-part-records.json
          test -s site/samples/SoldierField/WebGpuRunner/research-demonstrations.json
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
