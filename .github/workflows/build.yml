name: raWWar build and contract checks

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
    inputs:
      contract_failure_fixture:
        description: "Emit one deliberate failed contract check for CiAi evidence"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create exact workflow provenance record
        id: provenance
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p TestResults/provenance
          pull_request="$(jq -c 'if .pull_request then {
            number: .pull_request.number,
            head: { ref: .pull_request.head.ref, sha: .pull_request.head.sha },
            base: { ref: .pull_request.base.ref, sha: .pull_request.base.sha }
          } else null end' "$GITHUB_EVENT_PATH")"
          checkout_sha="$(git rev-parse HEAD)"
          jq -n \
            --arg repository "$REPOSITORY" \
            --argjson runId "$RUN_ID" \
            --argjson runAttempt "$RUN_ATTEMPT" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg eventName "$EVENT_NAME" \
            --arg eventRef "$EVENT_REF" \
            --arg eventSha "$EVENT_SHA" \
            --arg checkoutRef "$EVENT_REF" \
            --arg checkoutSha "$checkout_sha" \
            --argjson pullRequest "$pull_request" \
            '{
              schema: "ciai.workflow-provenance.v1",
              repository: $repository,
              runId: $runId,
              runAttempt: $runAttempt,
              workflow: { ref: $workflowRef, sha: $workflowSha },
              event: {
                name: $eventName,
                ref: $eventRef,
                sha: $eventSha,
                pullRequest: $pullRequest
              },
              checkout: { ref: $checkoutRef, sha: $checkoutSha }
            }' > TestResults/provenance/workflow-provenance.json
          jq -e '
            .schema == "ciai.workflow-provenance.v1" and
            (.repository | type == "string" and length > 0) and
            (.runId | type == "number" and . > 0) and
            (.runAttempt | type == "number" and . > 0) and
            (.workflow.ref | type == "string" and length > 0) and
            (.workflow.sha | test("^[0-9a-fA-F]{40}$")) and
            (.event.sha | test("^[0-9a-fA-F]{40}$")) and
            (.checkout.sha | test("^[0-9a-fA-F]{40}$"))
          ' TestResults/provenance/workflow-provenance.json >/dev/null
          echo "Workflow provenance payload created for run $RUN_ID attempt $RUN_ATTEMPT."
      - name: Upload exact workflow provenance artifact
        if: always() && hashFiles('TestResults/provenance/workflow-provenance.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rawwar-workflow-provenance-${{ github.run_attempt }}
          path: TestResults/provenance/workflow-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify CiAi build observation contract
        id: observation_contracts
        run: python3 -m unittest tools/test_write_build_observation.py
      - name: Set up Node.js for the Experience-owned browser lab
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Soldier Field README previews from the procedural mesh
        id: preview
        run: node samples/SoldierField/WebGpuRunner/render-soldier-previews.mjs
      - name: Upload generated Soldier Field previews for inspection
        uses: actions/upload-artifact@v4
        with:
          name: soldier-field-preview-svg
          path: docs/images/soldier-field/*.svg
          if-no-files-found: error
      - name: Verify checked-in Soldier Field previews match the source generator
        id: preview_diff
        run: git diff --exit-code -- docs/images/soldier-field/
      - name: Verify generated Soldier Field previews
        id: preview_validate
        shell: bash
        run: |
          set -euo pipefail
          for image in 01-front.svg 02-three-quarter.svg 03-profile.svg 04-rear.svg 05-armor-detail.svg 06-field-formation.svg; do
            file="docs/images/soldier-field/$image"
            test -s "$file" || { echo "Missing or empty Soldier Field preview: $file"; exit 1; }
            grep -q '<polygon' "$file" || { echo "No mesh triangles rendered in: $file"; exit 1; }
          done
      - name: Run Soldier Field data and research tests
        id: soldier_tests
        run: node --test samples/SoldierField/WebGpuRunner/*.test.mjs
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        id: build
        run: dotnet build raWWar.sln --configuration Release
      - name: Verify package contains its README and both manifests (local pack only)
        id: package
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/raWWar/raWWar.csproj --configuration Release --no-build --output artifacts/packages
          package="$(find artifacts/packages -maxdepth 1 -name '*.nupkg' -print -quit)"
          test -n "$package"
          contents="$(unzip -Z1 "$package")"
          printf '%s\n' "$contents"
          grep -Fxq 'README.md' <<< "$contents"
          grep -Eq '(^|/)manifest\.json$' <<< "$contents"
          grep -Eq '(^|/)runtime-manifest\.json$' <<< "$contents"
      - name: Run executable contract checks
        id: contracts
        env:
          RAWWAR_CONTRACT_FAILURE_FIXTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_failure_fixture && 'true' || 'false' }}
        run: dotnet run --project tests/raWWar.ContractTests/raWWar.ContractTests.csproj --configuration Release
      - name: Package contract TRX with exact workflow provenance
        if: always() && hashFiles('TestResults/results.trx') != '' && hashFiles('TestResults/provenance/workflow-provenance.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/evidence
          cp TestResults/results.trx TestResults/evidence/results.trx
          cp TestResults/provenance/workflow-provenance.json TestResults/evidence/provenance.json
      - name: Upload executable contract results and provenance (TRX)
        if: always() && hashFiles('TestResults/evidence/results.trx') != '' && hashFiles('TestResults/evidence/provenance.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rawwar-contract-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/evidence/*
          if-no-files-found: error
          retention-days: 14
      - name: Independently verify candidate event-frame reference bytes
        id: event_frame
        run: python3 tools/verify_candidate_event_frame.py
      - name: Run checked-in usage examples
        id: examples
        run: dotnet run --project examples/KeplerOrbit/raWWar.KeplerOrbitExample.csproj --configuration Release
      - name: Create CiAi build observation bundle
        id: observation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RAWWAR_STEP_OUTCOMES_JSON: >-
            {"soldierPreviewGeneration":"${{ steps.preview.outcome }}","soldierPreviewDiff":"${{ steps.preview_diff.outcome }}","soldierPreviewValidation":"${{ steps.preview_validate.outcome }}","soldierFieldTests":"${{ steps.soldier_tests.outcome }}","solutionBuild":"${{ steps.build.outcome }}","localPackageValidation":"${{ steps.package.outcome }}","executableContracts":"${{ steps.contracts.outcome }}","candidateEventFrameVerification":"${{ steps.event_frame.outcome }}","usageExamples":"${{ steps.examples.outcome }}","observationContracts":"${{ steps.observation_contracts.outcome }}"}
        run: python3 tools/write_build_observation.py
      - name: Upload CiAi build observation bundle
        if: always() && hashFiles('TestResults/observation-bundle/observation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rawwar-build-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/observation-bundle/**
          if-no-files-found: error
          retention-days: 14
