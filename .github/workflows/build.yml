name: raWWar build and contract checks

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for the Experience-owned browser lab
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Soldier Field README previews from the procedural mesh
        run: node samples/SoldierField/WebGpuRunner/render-soldier-previews.mjs
      - name: Upload generated Soldier Field previews for inspection
        uses: actions/upload-artifact@v4
        with:
          name: soldier-field-preview-svg
          path: docs/images/soldier-field/*.svg
          if-no-files-found: error
      - name: Verify checked-in Soldier Field previews match the source generator
        run: git diff --exit-code -- docs/images/soldier-field/
      - name: Verify generated Soldier Field previews
        shell: bash
        run: |
          set -euo pipefail
          for image in 01-front.svg 02-three-quarter.svg 03-profile.svg 04-rear.svg 05-armor-detail.svg 06-field-formation.svg; do
            file="docs/images/soldier-field/$image"
            test -s "$file" || { echo "Missing or empty Soldier Field preview: $file"; exit 1; }
            grep -q '<polygon' "$file" || { echo "No mesh triangles rendered in: $file"; exit 1; }
          done
      - name: Run Soldier Field data and research tests
        run: node --test samples/SoldierField/WebGpuRunner/*.test.mjs
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build raWWar.sln --configuration Release
      - name: Verify package contains its README and both manifests (local pack only)
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/raWWar/raWWar.csproj --configuration Release --no-build --output artifacts/packages
          package="$(find artifacts/packages -maxdepth 1 -name '*.nupkg' -print -quit)"
          test -n "$package"
          contents="$(unzip -Z1 "$package")"
          printf '%s\n' "$contents"
          grep -Fxq 'README.md' <<< "$contents"
          grep -Eq '(^|/)manifest\.json$' <<< "$contents"
          grep -Eq '(^|/)runtime-manifest\.json$' <<< "$contents"
      - name: Run executable contract checks
        run: dotnet run --project tests/raWWar.ContractTests/raWWar.ContractTests.csproj --configuration Release
      - name: Independently verify candidate event-frame reference bytes
        run: python3 tools/verify_candidate_event_frame.py
      - name: Run checked-in usage examples
        run: dotnet run --project examples/KeplerOrbit/raWWar.KeplerOrbitExample.csproj --configuration Release
